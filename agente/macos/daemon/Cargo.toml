[package]
name = "gobernanza-agente-macos"
version = "0.1.0"
edition = "2021"
description = "Agente de AIcontrol para macOS. Daemon de ITsec. S.A. y barra de menú, con el mismo proxy local que Windows."
publish = false

[lib]
name = "gobernanza_agente_macos"
path = "src/lib.rs"

[[bin]]
name = "gobernanza-daemon"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
webpki-roots = "0.26"
ring = "0.17"
